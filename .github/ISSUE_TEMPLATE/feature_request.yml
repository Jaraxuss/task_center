name: Feature request
description: Suggest an improvement for TaskCenter.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user need should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: Impact area
      options:
        - label: This may affect task or reminder time semantics.
        - label: This may affect reminder delivery or external messaging.
        - label: This may affect customer context, facts, or materials.
        - label: This may affect audit events or history.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request uses only synthetic examples and contains no real customer data, tokens, secrets, or open_id values.
          required: true
